[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "text-classifier"
version = "0.1.0"
description = "Classify text fields for translation eligibility"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [{ name = "SentioLabs" }]
keywords = ["text-classification", "nlp", "translation", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/SentioLabs/text-classifier-rs"
Repository = "https://github.com/SentioLabs/text-classifier-rs"
Issues = "https://github.com/SentioLabs/text-classifier-rs/issues"

[tool.maturin]
features = ["python"]
module-name = "text_classifier"
