version: '3'

tasks:
  train:setup:
    desc: Create venv and install dependencies
    cmds:
      - uv venv .venv
      - uv pip install --python .venv/bin/python openai datasets sentence-transformers faiss-cpu pandas numpy torch onnx onnxruntime

  train:pilot:
    desc: Generate 500 pilot samples and validate diversity
    cmds:
      - uv run generate_openrouter.py --output data/pilot_samples.jsonl --total-samples 500 --pilot
      - uv run validate_pilot.py --input data/pilot_samples.jsonl

  train:sample-real:
    desc: Sample ~25K real files from The Stack v1 (14 languages)
    cmds:
      - uv run sample_the_stack.py --output data/real_samples.jsonl --per-language 1800

  train:generate-synthetic:
    desc: Generate ~35K synthetic samples via OpenRouter (full model mix)
    cmds:
      - uv run generate_openrouter.py --output data/synthetic_samples.jsonl --total-samples 35000

  train:generate:
    desc: Generate full dataset (real + synthetic, ~60K total)
    cmds:
      - task train:sample-real
      - task train:generate-synthetic
      - cat data/real_samples.jsonl data/synthetic_samples.jsonl > data/raw_samples.jsonl

  train:split:
    desc: Split raw samples into 10K eval + 50K training
    cmds:
      - uv run split_dataset.py --input data/raw_samples.jsonl --eval-output ../eval/clear.jsonl --eval-boundary-output ../eval/boundary.jsonl --train-output data/golden_raw.csv

  train:dedup:
    desc: FAISS dedup on training split
    cmds:
      - uv run dedup.py --input data/golden_raw.csv --output data/golden_train.csv

  train:train:
    desc: Train model on deduped golden data
    cmds:
      - uv run train.py --input data/golden_train.csv --output output/

  train:update-model:
    desc: Copy trained model to src/ for embedding
    cmds:
      - cp output/model.onnx ../src/model.onnx
      - cp output/model_config.json ../src/model_config.json

  train:validate:
    desc: Validate against both golden eval sets
    cmds:
      - cd .. && cargo build --release --features onnx-model
      - cd .. && ./target/release/classify validate --input eval/clear.jsonl --json
      - cd .. && ./target/release/classify validate --input eval/boundary.jsonl --json

  train:pipeline:
    desc: Full pipeline -- generate -> split -> dedup -> train -> embed -> validate
    cmds:
      - task train:generate
      - task train:split
      - task train:dedup
      - task train:train
      - task train:update-model
      - task train:validate
