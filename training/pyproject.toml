[project]
name = "text-classifier-training"
version = "0.1.0"
description = "Training pipeline for text-classifier-rs"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "anthropic>=0.40",
    "onnx>=1.15",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
