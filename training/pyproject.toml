[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "text-classifier-training"
version = "0.1.0"
description = "Training pipeline for text-classifier-rs"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "anthropic>=0.40",
    "click>=8.1",
    "onnx>=1.15",
    "onnxscript>=0.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "tqdm>=4.60",
    "openai>=2.30.0",
    "polars>=1.39.3",
    "onnxruntime>=1.17",
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.0",
    "magika>=0.6",
    "datasets>=2.14",
    "huggingface-hub>=0.16",
]

[project.scripts]
trainr = "trainr.cli:main"

[tool.setuptools.packages.find]
include = ["trainr*"]

[dependency-groups]
dev = ["pytest", "ruff"]
