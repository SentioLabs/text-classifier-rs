[package]
name = "text-classifier"
version = "0.3.0"
edition = "2024"
description = "Classify text fields by structural type — prose, code, tabular data, or PDF artifacts"
license = "MIT"
repository = "https://github.com/SentioLabs/text-classifier-rs"
homepage = "https://github.com/SentioLabs/text-classifier-rs"
readme = "README.md"
keywords = ["text-classification", "nlp", "prose-detection", "cli"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
flate2 = "1"

[dependencies.pyo3]
version = "0.28"
features = ["extension-module"]
optional = true

[dependencies.ort]
version = "2.0.0-rc.12"
optional = true

[dependencies.ndarray]
version = "0.16"
optional = true

[features]
default = []
python = ["pyo3"]
onnx-model = ["ort", "ndarray"]

[lib]
name = "text_classifier"
crate-type = ["lib", "cdylib"]

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "classify"
path = "src/main.rs"
