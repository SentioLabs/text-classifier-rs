[package]
name = "text-classifier"
version = "0.1.0"
edition = "2024"
description = "Classify text fields for translation eligibility"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
flate2 = "1"

[dependencies.pyo3]
version = "0.28"
features = ["extension-module"]
optional = true

[dependencies.fasttext]
version = "0.7"
optional = true

[features]
default = []
python = ["pyo3"]
model = ["fasttext"]

[lib]
name = "text_classifier"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "classify"
path = "src/main.rs"
